<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#7cc3ee" />
  <meta name="description" content="Thời tiết thành phố 3D — Hà Nội, Đà Nẵng, TP. Hồ Chí Minh với dữ liệu thời tiết thời gian thực." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%85%3C/text%3E%3C/svg%3E" />
  <title>Thời tiết 3D · City Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    /* critical boot styles — inline so nothing renders unstyled */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe9f7; }
    body.booting #hud, body.booting #dock, body.booting #hint, body.booting #loader, body.booting #scene { visibility: hidden; }
    #splash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(180deg, #7cc3ee 0%, #cfe9f7 80%); transition: opacity .6s ease, visibility .6s; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .sp-tile { position: relative; width: 120px; height: 120px; animation: spFloat 2.6s ease-in-out infinite; }
    .sp-tile .top { position: absolute; left: 50%; top: 18px; width: 84px; height: 84px; margin-left: -42px; transform: rotateX(60deg) rotateZ(45deg); transform-origin: 50% 50%;
      background: linear-gradient(135deg, #8ccf6a 0 30%, #5fae95 30% 62%, #e9a160 62%); border-radius: 6px; box-shadow: 0 0 0 3px rgba(255,255,255,.35) inset; }
    .sp-tile .side { position: absolute; left: 50%; top: 72px; width: 84px; height: 26px; margin-left: -42px; background: linear-gradient(90deg, #c9a378, #e7cfa6 50%, #bf9468);
      clip-path: polygon(0 0, 50% 45%, 100% 0, 100% 55%, 50% 100%, 0 55%); }
    .sp-tile .b { position: absolute; bottom: 58px; width: 10px; background: #fff3e2; border-radius: 2px 2px 0 0; box-shadow: inset -3px 0 rgba(0,0,0,.08); animation: spGrow 1.6s ease-in-out infinite alternate; transform-origin: bottom; }
    .sp-tile .b:nth-child(3) { left: 40px; height: 26px; } .sp-tile .b:nth-child(4) { left: 56px; height: 40px; animation-delay: .2s; background: #e9f2f7; }
    .sp-tile .b:nth-child(5) { left: 72px; height: 20px; animation-delay: .4s; }
    .sp-name { color: #fff; font-weight: 800; font-size: 26px; letter-spacing: .03em; text-shadow: 0 2px 0 rgba(120,150,180,.35), 0 8px 20px rgba(30,60,90,.25); }
    .sp-bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.4); overflow: hidden; }
    .sp-bar b { display: block; width: 40%; height: 100%; border-radius: 4px; background: #fff; animation: spBar 1.1s ease-in-out infinite; }
    @keyframes spFloat { 50% { transform: translateY(-8px); } }
    @keyframes spGrow { to { transform: scaleY(1.25); } }
    @keyframes spBar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body class="booting">
  <div id="splash" aria-label="Loading"><div class="sp-tile"><div class="top"></div><div class="side"></div><i class="b"></i><i class="b"></i><i class="b"></i></div><div class="sp-name">Thời tiết 3D</div><div class="sp-bar"><b></b></div></div>
  <div id="sky"></div>
  <div id="stars"></div>
  <canvas id="scene" aria-label="3D city"></canvas>
  <div id="flash"></div>

  <header id="hud">
    <div class="topbar">
      <div class="live" id="live"><span class="dot"></span><span id="updated">…</span></div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="vi">VI</button><button data-lang="en">EN</button>
      </div>
    </div>
    <div class="hero" id="hero">
      <h1 id="city-title">Hà Nội</h1>
      <div id="wx-icon"></div>
      <div id="wx-label"></div>
      <div id="temp-range"></div>
      <div id="meta">
        <div id="temp-now"></div>
        <div id="aqi"></div>
        <div id="date"></div>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <nav id="dock">
    <div class="cities" id="cities" role="tablist"></div>
    <button id="sim-btn" class="sim-btn" aria-expanded="false"></button>
  </nav>

  <section id="sim-panel" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="sim-title"></h2>
        <button id="sim-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="grid" id="cond-grid"></div>
      <h3 id="time-title"></h3>
      <div class="segment" id="time-seg"></div>
      <button id="live-btn" class="live-btn"></button>
    </div>
  </section>

  <div id="hint"></div>
  <div id="toast"></div>
  <div id="about-widget">
    <section id="about-card" class="about-card" aria-labelledby="about-title" hidden>
      <div class="about-head">
        <h2 id="about-title"></h2>
        <button id="about-close" class="about-close" type="button" aria-label="Close">✕</button>
      </div>
      <p id="about-description"></p>
      <p class="about-source"><span id="about-source-label"></span> <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo ↗</a></p>
      <a class="about-repo" href="https://github.com/trongthanh/city-weather" target="_blank" rel="noopener noreferrer">
        <span id="about-repo-label"></span><b>trongthanh/city-weather ↗</b>
      </a>
      <p class="about-credit"><span id="about-by"></span> <a href="https://github.com/trongthanh" target="_blank" rel="noopener noreferrer">@trongthanh</a> · <a href="https://thanh.im" target="_blank" rel="noopener noreferrer">thanh.im</a></p>
    </section>
    <button id="about-toggle" class="about-toggle" type="button" aria-expanded="false" aria-controls="about-card">
      <span class="about-mark" aria-hidden="true">i</span><span id="about-cta"></span>
    </button>
  </div>
  <div id="loader"><div class="spinner"></div><p id="loader-text"></p></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
